# Local Postgres if you don't want a Neon or Supabase account:
#   docker compose up -d
# Then in .env.local: DATABASE_URL="postgres://postgres:postgres@localhost:5432/makan_finder"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: makan_finder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
